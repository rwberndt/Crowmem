services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: corvid
      POSTGRES_PASSWORD: corvid
      POSTGRES_DB: corvid_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvid -d corvid_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
