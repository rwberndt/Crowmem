[project]
name = "corvid"
version = "0.1.0"
description = "Corvid Memory Architecture - adaptive, goal-conditioned memory engine for AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pgvector>=0.3.6",
    "anthropic>=0.40",
    "fastembed>=0.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
